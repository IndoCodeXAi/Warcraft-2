name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Download PCSX ReARMed core (arm64)
        run: |
          D=app/src/main/jniLibs/arm64-v8a
          mkdir -p $D
          curl -fL -o core.zip https://buildbot.libretro.com/nightly/android/latest/arm64-v8a/pcsx_rearmed_libretro_android.so.zip
          unzip -o core.zip -d $D
          mv $D/pcsx_rearmed_libretro_android.so $D/libpcsx_rearmed_libretro_android.so
          ls -la $D
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: WarCraft2-PS1-apk
          path: app/build/outputs/apk/debug/*.apk
